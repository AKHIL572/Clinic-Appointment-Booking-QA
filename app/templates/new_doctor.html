{% extends "base.html" %}
{% block title %}Add Doctor | MediCare Portal{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Add New Doctor</h1>
</div>

<div class="form-card">
  <form method="POST">
    <div class="form-group">
      <label for="doctor-name">Full Name</label>
      <input type="text" name="name" id="doctor-name" placeholder="Dr. John Smith" required>
    </div>

    <div class="form-group">
      <label for="doctor-email">Email Address</label>
      <input type="email" name="email" id="doctor-email" placeholder="doctor@example.com" required>
    </div>

    <div class="form-group">
      <label for="doctor-specialization">Specialization</label>
      <input type="text" name="specialization" id="doctor-specialization" placeholder="e.g. Dermatology, Cardiology"
        required>
    </div>

    <div class="form-group">
      <label for="doctor-password">Temporary Password</label>
      <input type="password" name="password" id="doctor-password" placeholder="••••••••" required minlength="8">
    </div>

    <button type="submit" data-qa="save-doctor-button" class="btn btn-full">Save Doctor</button>
  </form>
</div>
{% endblock %}
