{% extends "base.html" %}
{% block title %}Register | MediCare Portal{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Patient Registration Portal</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" name="name" data-qa="signup-name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" name="email" data-qa="signup-email" placeholder="name@example.com"
          required>
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" data-qa="signup-password" placeholder="••••••••"
          required minlength="8">
      </div>

      <button type="submit" data-qa="signup-button" class="btn btn-full">Register</button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
    </div>
  </div>
</div>
{% endblock %}
