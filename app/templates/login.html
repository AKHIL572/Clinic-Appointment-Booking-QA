{% extends "base.html" %}
{% block title %}Login | MediCare Portal{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to access your clinic portal</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" name="email" data-qa="login-email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" data-qa="login-password" placeholder="••••••••"
          required>
      </div>

      <button type="submit" data-qa="login-button" class="btn btn-full">Login</button>
    </form>

    <div class="auth-footer">
      <p>No account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
    </div>
  </div>
</div>
{% endblock %}
