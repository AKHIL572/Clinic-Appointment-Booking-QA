name: UI Test Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Selenium Pytest Automation Suite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ui_tests/requirements.txt

      - name: Seed Database
        run: |
          python seed_data.py

      - name: Start Flask Application
        run: |
          python run.py &
          timeout 15 bash -c 'until curl -s http://127.0.0.1:5000/ > /dev/null; do sleep 1; done'

      - name: Run Selenium Pytest Suite (Headless)
        run: |
          cd ui_tests
          HEADLESS=1 python -m pytest -v

      - name: Upload Test Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-screenshots
          path: ui_tests/screenshots/
          if-no-files-found: ignore
